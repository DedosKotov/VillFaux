# Шанс естественного появления: 0.0005 = 0.05%.
spawn-chance: 0.0005

# Задержка после смерти естественного VillFaux.
# После задержки разрешается вероятностное появление,
# а не автоматическое создание нового жителя.
respawn-hours: 12

# Радиус проверки близости к сгенерированной деревне.
village-radius: 96.0

# Последствия проверяются после каждой успешной сделки.
# Выбирается только один результат:
# 5% — взрыв, 5% — тыква, 10% — две стрелы,
# 80% — сделка без последствий.
trade-explosion-chance: 5.0
pumpkin-chance: 5.0
arrows-chance: 10.0

# Мощность взрыва при торговле.
trade-explosion-power: 7.0

# Мощность взрыва после смерти жителя или поборника.
# Шанс 100% установлен непосредственно в новом коде.
explosion-power: 7.0